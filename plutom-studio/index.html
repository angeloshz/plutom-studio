<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUTOM STUDIO — Iniciar Sesión</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  .login-container {
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    object-fit: contain;
  }
  .login-title {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .login-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,168,75,0.4), transparent);
  }
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .form-group label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    display: block;
  }
  .form-group input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    transition: all 0.18s var(--ease);
    width: 100%;
    outline: none;
  }
  .form-group input:focus {
    border-color: rgba(138,155,176,0.4);
    box-shadow: 0 0 0 3px rgba(26,58,92,0.25);
    background: var(--surface3);
  }
  .remember-forgot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .remember-forgot label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-mid);
    font-weight: 500;
    margin: 0;
  }
  .forgot-link {
    color: var(--accent2);
    cursor: pointer;
    text-decoration: none;
  }
  .forgot-link:hover { color: var(--accent); }
  .btn-login {
    background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
    color: var(--silver-pale);
    border: 1px solid rgba(138,155,176,0.18);
    padding: 11px 16px;
    border-radius: var(--radius-sm);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    box-shadow: 0 2px 10px rgba(10,20,40,0.5);
    width: 100%;
    letter-spacing: 0.02em;
  }
  .btn-login:hover {
    background: linear-gradient(135deg, var(--navy-light), #2d5f8a);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(26,58,92,0.5);
    border-color: rgba(200,168,75,0.3);
  }
  .error-message {
    background: rgba(224,82,82,0.1);
    border: 1px solid rgba(224,82,82,0.2);
    color: var(--red);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    display: none;
  }
  .error-message.show { display: block; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .divider-text {
    font-size: 12px;
    color: var(--text-muted);
  }
  .signup-prompt {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }
  .signup-prompt a {
    color: var(--accent2);
    cursor: pointer;
    font-weight: 600;
  }
  .login-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <img src="img/logo-icon.png" alt="PLUTOM STUDIO" class="login-logo" onerror="this.style.display='none'">
    <h1 class="login-title">PLUTOM STUDIO</h1>
    <p class="login-subtitle">Management Platform<br>Gestión integral para tu agencia creativa</p>
  </div>

  <div class="login-box">
    <div id="errorMsg" class="error-message"></div>
    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Correo o Usuario</label>
        <input type="text" id="email" placeholder="usuario@plutomstudio.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
      </div>
      <div class="remember-forgot">
        <label><input type="checkbox" id="rememberMe" checked> Recuérdame</label>
        <a class="forgot-link" onclick="alert('Contacta al administrador para recuperar acceso')">¿Olvidé la contraseña?</a>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
    </form>
  </div>

  <div class="login-footer">
    <div style="margin-bottom:12px;">🔒 Esta plataforma es privada y requiere autenticación</div>
    <div style="font-size:11px;opacity:0.6;">© 2025 PLUTOM STUDIO. All rights reserved.</div>
  </div>
</div>

<script>
  const DEFAULT_USERS = [
    { username: 'admin', email: 'admin@plutomstudio.com', password: 'admin123', role: 'admin' },
    { username: 'plutom', email: 'info@plutomstudio.com', password: 'plutom2025', role: 'admin' },
  ];

  function initUsers() {
    if (!localStorage.getItem('ps_users')) {
      localStorage.setItem('ps_users', JSON.stringify(DEFAULT_USERS));
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const errorMsg = document.getElementById('errorMsg');
    const btnLogin = document.getElementById('btnLogin');

    errorMsg.classList.remove('show');
    btnLogin.disabled = true;
    btnLogin.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid rgba(138,155,176,0.3);border-top-color:var(--accent2);border-radius:50%;animation:spin 0.8s linear infinite;"></span> Verificando...';

    setTimeout(() => {
      const users = JSON.parse(localStorage.getItem('ps_users') || '[]');
      const user = users.find(u => (u.email === email || u.username === email) && u.password === password);

      if (user) {
        const userData = { email: user.email, username: user.username, role: user.role };
        localStorage.setItem('ps_currentUser', JSON.stringify(userData));
        if (rememberMe) localStorage.setItem('ps_rememberMe', 'true');
        else localStorage.removeItem('ps_rememberMe');

        btnLogin.innerHTML = '✓ Iniciando...';
        btnLogin.style.background = 'var(--green)';
        setTimeout(() => window.location.href = 'plutom-studio-dashboard.html', 500);
      } else {
        errorMsg.innerHTML = '❌ Usuario o contraseña incorrectos';
        errorMsg.classList.add('show');
        btnLogin.disabled = false;
        btnLogin.innerHTML = 'Iniciar Sesión';
      }
    }, 200);
  }

  initUsers();
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
