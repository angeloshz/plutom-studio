<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="theme-color" content="#0F1522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLUTOM STUDIO">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PLUTOM STUDIO — Inventario</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
  .equipo-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; flex-direction: column; gap: 8px; animation: fadeUp 0.4s ease both;
  }
  .equipo-card:hover { border-color: var(--border-hover); }
  .equipo-nombre { font-family:'Outfit',sans-serif; font-size: 13px; font-weight: 700; }
  .equipo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 1200px) { .equipo-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 768px) { .equipo-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="btn-hamburguesa" onclick="toggleMenu()">☰</button>
      <div class="page-title">📦 Inventario</div>
    </div>
    <div class="topbar-right" style="display:flex;gap:12px;align-items:center;">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar equipo..." oninput="filtrar()">
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo Equipo</button>
    </div>
  </div>

  <!-- MENÚ MOBILE HAMBURGUESA -->
  <div id="menu-movil" class="menu-movil">
    <div class="menu-movil-content">
      <div class="menu-section-title">Principal</div>
      <button class="menu-item" onclick="window.location='plutom-studio-dashboard.html'">🏠 Dashboard</button>
      <button class="menu-item" onclick="window.location='clientes.html'">👥 Clientes</button>
      <button class="menu-item" onclick="window.location='cotizaciones.html'">📄 Cotizaciones</button>
      <button class="menu-item" onclick="window.location='facturas.html'">📋 Facturas</button>
      
      <div class="menu-section-title">Operaciones</div>
      <button class="menu-item" onclick="window.location='finanzas.html'">💰 Finanzas</button>
      <button class="menu-item active" onclick="window.location='inventario.html'">📦 Inventario</button>
      <button class="menu-item" onclick="window.location='proyectos.html'">✨ Proyectos</button>
      <button class="menu-item" onclick="window.location='eventos.html'">🎉 Eventos</button>
      
      <div class="menu-section-title">Análisis</div>
      <button class="menu-item" onclick="window.location='reportes.html'">📊 Reportes</button>
      <button class="menu-item" onclick="window.location='servicios.html'">🔧 Servicios</button>
    </div>
  </div>

  <div class="content">
    <div class="kpi-grid">
      <div class="kpi-card anim-1">
        <div class="kpi-header"><span class="kpi-label">Total Equipos</span><div class="kpi-icon navy">📦</div></div>
        <div class="kpi-value" id="kpi-total">0</div>
        <div class="kpi-footer"><span class="kpi-change neu">—</span><span class="kpi-sub">registrados</span></div>
      </div>
      <div class="kpi-card anim-2">
        <div class="kpi-header"><span class="kpi-label">Disponibles</span><div class="kpi-icon green">✅</div></div>
        <div class="kpi-value" id="kpi-disponibles">0</div>
        <div class="kpi-footer"><span class="kpi-change pos" id="kpi-pct">0%</span><span class="kpi-sub">listos</span></div>
      </div>
      <div class="kpi-card anim-3">
        <div class="kpi-header"><span class="kpi-label">En Uso</span><div class="kpi-icon blue">⚙️</div></div>
        <div class="kpi-value" id="kpi-enuso">0</div>
        <div class="kpi-footer"><span class="kpi-change neu">—</span><span class="kpi-sub">siendo usados</span></div>
      </div>
      <div class="kpi-card anim-4">
        <div class="kpi-header"><span class="kpi-label">Valor Total</span><div class="kpi-icon purple">💰</div></div>
        <div class="kpi-value" id="kpi-valor" style="font-size:18px;">RD$0</div>
        <div class="kpi-footer"><span class="kpi-change neu">—</span><span class="kpi-sub">inventario</span></div>
      </div>
    </div>

    <div class="card" style="padding:20px;animation:fadeUp 0.45s 0.25s ease both;">
      <div style="margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;">
        <div class="card-title">📦 Equipos</div>
        <select id="filtroCategoria" onchange="filtrar()" style="width:auto;padding:7px 32px 7px 12px;font-size:12.5px;">
          <option value="">Todas</option>
          <option>Cámaras</option>
          <option>Lentes</option>
          <option>Drones</option>
          <option>Iluminación</option>
          <option>Trípodes</option>
          <option>Micrófonos</option>
        </select>
      </div>
      <div class="equipo-grid" id="gridEquipos"></div>
      <div id="emptyEquipos" class="empty-state" style="display:none;padding:40px;">
        <div class="empty-icon">📦</div>
        <div class="empty-title">Sin equipos</div>
        <div class="empty-sub">Agrega tu primer equipo desde aquí</div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📦 Nuevo Equipo</div>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="nombre" placeholder="Ej. Cámara Sony A7R V">
      </div>
      <div class="form-group">
        <label>Categoría *</label>
        <select id="categoria">
          <option value="">Seleccionar...</option>
          <option>Cámaras</option>
          <option>Lentes</option>
          <option>Drones</option>
          <option>Iluminación</option>
          <option>Trípodes</option>
          <option>Micrófonos</option>
        </select>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Número de Serie</label>
          <input type="text" id="serie" placeholder="ABC-123456">
        </div>
        <div class="form-group">
          <label>Fecha de Adquisición</label>
          <input type="date" id="fecha">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Valor (RD$)</label>
          <input type="number" id="valor" placeholder="0.00" min="0">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="estado">
            <option>Disponible</option>
            <option>En Uso</option>
            <option>Mantenimiento</option>
            <option>Dañado</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Ubicación</label>
        <input type="text" id="ubicacion" placeholder="Oficina...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/shell.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>
  let inventario = JSON.parse(localStorage.getItem('ps_inventario') || '[]');
  let editandoId = null;

  function renderGrid() {
    const grid = document.getElementById('gridEquipos');
    const empty = document.getElementById('emptyEquipos');
    
    if (inventario.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'flex';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = inventario.map(e => `
        <div class="equipo-card">
          <div class="equipo-nombre">${e.nombre}</div>
          <div style="font-size:11px;color:var(--text-muted);">${e.categoria}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="chip ${e.estado === 'Disponible' ? 'chip-green' : 'chip-amber'}">${e.estado}</span>
            ${e.valor ? `<span class="chip chip-navy">RD$${Number(e.valor).toLocaleString('es-DO')}</span>` : ''}
          </div>
          <div style="display:flex;gap:6px;font-size:11px;color:var(--text-muted);">
            ${e.serie ? `<span>🔢 ${e.serie}</span>` : ''}
            ${e.ubicacion ? `<span>📍 ${e.ubicacion}</span>` : ''}
          </div>
          <div style="display:flex;gap:6px;justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" onclick="abrirModal(${e.id})">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="eliminar(${e.id})">🗑️</button>
          </div>
        </div>`).join('');
    }
    actualizarKPIs();
  }

  function actualizarKPIs() {
    const disponibles = inventario.filter(e => e.estado === 'Disponible').length;
    const enuso = inventario.filter(e => e.estado === 'En Uso').length;
    const pct = inventario.length > 0 ? Math.round((disponibles / inventario.length) * 100) : 0;
    const valor = inventario.reduce((s, e) => s + Number(e.valor || 0), 0);

    document.getElementById('kpi-total').textContent = inventario.length;
    document.getElementById('kpi-disponibles').textContent = disponibles;
    document.getElementById('kpi-pct').textContent = `${pct}%`;
    document.getElementById('kpi-enuso').textContent = enuso;
    document.getElementById('kpi-valor').textContent = `RD$${valor.toLocaleString('es-DO')}`;
  }

  function filtrar() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const categoria = document.getElementById('filtroCategoria').value;
    const grid = document.getElementById('gridEquipos');

    let filtrados = inventario.filter(e =>
      (e.nombre.toLowerCase().includes(search) || (e.serie||'').toLowerCase().includes(search)) &&
      (!categoria || e.categoria === categoria)
    );

    if (filtrados.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">No hay resultados</div>';
    } else {
      grid.innerHTML = filtrados.map(e => `
        <div class="equipo-card">
          <div class="equipo-nombre">${e.nombre}</div>
          <div style="font-size:11px;color:var(--text-muted);">${e.categoria}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="chip ${e.estado === 'Disponible' ? 'chip-green' : 'chip-amber'}">${e.estado}</span>
            ${e.valor ? `<span class="chip chip-navy">RD$${Number(e.valor).toLocaleString('es-DO')}</span>` : ''}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost btn-sm" onclick="abrirModal(${e.id})">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="eliminar(${e.id})">🗑️</button>
          </div>
        </div>`).join('');
    }
  }

  function abrirModal(id = null) {
    editandoId = id;
    if (id) {
      const e = inventario.find(x => x.id === id);
      document.getElementById('nombre').value = e.nombre;
      document.getElementById('categoria').value = e.categoria;
      document.getElementById('serie').value = e.serie;
      document.getElementById('fecha').value = e.fecha;
      document.getElementById('valor').value = e.valor;
      document.getElementById('estado').value = e.estado;
      document.getElementById('ubicacion').value = e.ubicacion;
    } else {
      ['nombre','categoria','serie','fecha','valor','ubicacion'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('estado').value = 'Disponible';
    }
    document.getElementById('modalOverlay').classList.add('open');
  }

  function cerrarModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) cerrarModal();
  });

  async function guardar() {
    const nombre = document.getElementById('nombre').value.trim();
    const categoria = document.getElementById('categoria').value;

    if (!nombre || !categoria) {
      alert('Completa los campos obligatorios (*)');
      return;
    }

    const datos = {
      nombre, categoria,
      serie: document.getElementById('serie').value.trim(),
      fecha: document.getElementById('fecha').value,
      valor: parseFloat(document.getElementById('valor').value) || 0,
      estado: document.getElementById('estado').value,
      ubicacion: document.getElementById('ubicacion').value.trim(),
    };

    if (editandoId) {
      datos.id = editandoId;
      const idx = inventario.findIndex(x => x.id === editandoId);
      inventario[idx] = { ...inventario[idx], ...datos };
      localStorage.setItem('ps_inventario', JSON.stringify(inventario));
      if (window.guardarEnSupabase) {
        await window.guardarEnSupabase('inventario', datos, true);
      }
    } else {
      datos.id = Date.now();
      inventario.push(datos);
      localStorage.setItem('ps_inventario', JSON.stringify(inventario));
      if (window.guardarEnSupabase) {
        await window.guardarEnSupabase('inventario', datos, false);
      }
    }

    cerrarModal();
    renderGrid();
  }

  async function eliminar(id) {
    if (!confirm('¿Eliminar?')) return;
    inventario = inventario.filter(x => x.id !== id);
    localStorage.setItem('ps_inventario', JSON.stringify(inventario));
    if (window.eliminarDeSupabase) {
      await window.eliminarDeSupabase('inventario', id);
    }
    renderGrid();
  }

  renderGrid();
</script>

<script>
function toggleMenu() { const m = document.getElementById("menu-movil"); if(m) m.classList.toggle("open"); }
function cerrarMenu() { const m = document.getElementById("menu-movil"); if(m) m.classList.remove("open"); }
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".menu-item").forEach(i => i.addEventListener("click", cerrarMenu));
  const o = document.getElementById("menu-movil");
  if(o) o.addEventListener("click", e => e.target === o && cerrarMenu());
});
</script>
</body>
</html>
